[project]
name = "flowcoder"
version = "0.2.0"
description = "本地优先的自研 Agent 运行时：TUI + daemon + headless CLI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "websockets>=14.0",
    "ruff>=0.15,<0.17",
]
sandbox = [
    "docker>=7.0",
]

[project.scripts]
flowcoder = "flowcoder.__main__:main"
flowcoder-daemon = "flowcoder.daemon.server:run_daemon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/flowcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "docker: 需要本机 Docker 的集成测试（无 Docker 环境自动跳过）",
    "slow: 耗时较长的测试",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# daemon/routes/core.py 的导入放在路由定义后是刻意的延迟导入（规避循环导入）
"src/flowcoder/daemon/routes/core.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "websockets>=14.0",
    "ruff>=0.15,<0.17",
]
