name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv pip install -e ".[dev]" --system
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
