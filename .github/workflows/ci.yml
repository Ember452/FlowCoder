name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # 版本与 pyproject dev 组钉在同一范围，避免新版 ruff 默认规则漂移导致假失败
        run: pip install "ruff>=0.15,<0.16"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run integration tests
        run: pytest tests/integration -q

      - name: Run e2e tests
        # e2e 全部基于 fake/进程内 TestClient（除 docker 标记用例自带 skipif），
        # 不依赖真实 LLM API，纳入 CI 防关键路径回归
        run: pytest tests/e2e -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Unit tests with coverage
        # fail_under 钉在 pyproject [tool.coverage.report]，低于基线即失败
        run: pytest tests/unit --cov=src/flowcoder --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable
